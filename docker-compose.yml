services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-regismatic}
      POSTGRES_USER: ${POSTGRES_USER:-regismatic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-regismatic_dev_password}
    ports:
      - "5433:5432"
    volumes:
      - regismatic-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-regismatic} -d ${POSTGRES_DB:-regismatic}"]
      interval: 10s
      timeout: 5s
      retries: 6

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-regismatic}:${POSTGRES_PASSWORD:-regismatic_dev_password}@db:5432/${POSTGRES_DB:-regismatic}?schema=public
      JWT_SECRET: ${JWT_SECRET:-change_this_super_secret_key}
      JWT_EXPIRES_IN: 12h
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8100}
      TRUST_PROXY: false
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-900000}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-10}
      RUN_SEED: ${RUN_SEED:-true}
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4000/api}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8100}:80"
    depends_on:
      - api

volumes:
  regismatic-db:
