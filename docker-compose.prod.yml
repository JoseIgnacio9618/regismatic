services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-regismatic}
      POSTGRES_USER: ${POSTGRES_USER:-regismatic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_strong}
    volumes:
      - regismatic-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-regismatic} -d ${POSTGRES_DB:-regismatic}"]
      interval: 10s
      timeout: 5s
      retries: 6

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-regismatic}:${POSTGRES_PASSWORD:-change_me_strong}@db:5432/${POSTGRES_DB:-regismatic}?schema=public
      JWT_SECRET: ${JWT_SECRET:-change_me_with_very_long_secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      CORS_ORIGIN: https://${APP_DOMAIN:-app.localhost},https://${API_DOMAIN:-api.localhost}
      TRUST_PROXY: true
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-900000}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-10}
      RUN_SEED: ${RUN_SEED:-false}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.localhost/api}
    restart: unless-stopped
    depends_on:
      - api

  proxy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-app.localhost}
      API_DOMAIN: ${API_DOMAIN:-api.localhost}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

volumes:
  regismatic-db:
  caddy_data:
  caddy_config:
