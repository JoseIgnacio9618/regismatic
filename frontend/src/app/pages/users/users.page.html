<app-main-layout title="Gestion de personal">
  <ion-grid fixed>
    <ion-row>
      <ion-col size="12" size-md="5">
        <ion-card class="glass-card">
          <ion-card-header>
            <ion-card-title>Crear usuario</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <ion-item>
              <ion-label position="stacked">Nombre completo</ion-label>
              <ion-input [(ngModel)]="fullName"></ion-input>
            </ion-item>

            <ion-item>
              <ion-label position="stacked">Email</ion-label>
              <ion-input type="email" [(ngModel)]="email"></ion-input>
            </ion-item>

            <ion-item>
              <ion-label position="stacked">Password</ion-label>
              <ion-input type="text" [(ngModel)]="password"></ion-input>
            </ion-item>

            <ion-item>
              <ion-label position="stacked">Rol</ion-label>
              <ion-select [(ngModel)]="role">
                <ion-select-option value="EMPLOYEE">Empleado</ion-select-option>
                <ion-select-option value="ADMIN">Admin</ion-select-option>
              </ion-select>
            </ion-item>

            <ion-button expand="block" class="mt-16" (click)="createUser()">Guardar usuario</ion-button>
          </ion-card-content>
        </ion-card>
      </ion-col>

      <ion-col size="12" size-md="7">
        <ion-card class="glass-card">
          <ion-card-header>
            <ion-card-title>Plantilla</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <ion-list lines="inset">
              <ion-item *ngFor="let user of users">
                <ion-label>
                  <h3>{{ user.fullName }}</h3>
                  <p>{{ user.email }} | {{ user.role }}</p>
                </ion-label>
              </ion-item>
            </ion-list>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</app-main-layout>
