<ion-modal [isOpen]="isOpen" [backdropDismiss]="false" class="photo-cropper-modal">
  <ng-template>
    <ion-header translucent="true">
      <ion-toolbar>
        <ion-title>{{ "profile.crop_title" | t }}</ion-title>
        <ion-buttons slot="end">
          <ion-button fill="clear" (click)="close()">{{ "profile.crop_cancel" | t }}</ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>

    <ion-content class="cropper-content">
      <div class="cropper-layout">
        <section class="cropper-stage-panel">
          <p class="cropper-hint">{{ "profile.crop_hint" | t }}</p>
          <div
            #stage
            class="crop-stage"
            (pointerdown)="onPointerDown($event)"
            (pointermove)="onPointerMove($event)"
            (pointerup)="onPointerUp($event)"
            (pointerleave)="onPointerUp($event)"
            (pointercancel)="onPointerUp($event)"
          >
            <img
              #image
              *ngIf="sourceUrl"
              [src]="sourceUrl"
              [alt]="fullName"
              [style.transform]="imageTransform"
              [style.width.px]="displayedImageWidth"
              [style.height.px]="displayedImageHeight"
              [style.left.px]="imageLeft"
              [style.top.px]="imageTop"
              (load)="onImageLoad()"
            />
            <div class="crop-frame"></div>
          </div>

          <div class="zoom-row">
            <ion-icon name="remove-outline"></ion-icon>
            <ion-range min="1" max="2.6" step="0.01" [(ngModel)]="zoom" (ionInput)="onZoomChange()"></ion-range>
            <ion-icon name="add-outline"></ion-icon>
          </div>
          <p class="zoom-label">{{ "profile.crop_zoom" | t }}</p>
        </section>

        <aside class="cropper-preview-panel">
          <h3>{{ "profile.crop_preview" | t }}</h3>
          <canvas #previewCanvas class="preview-canvas"></canvas>
          <p>{{ "profile.crop_preview_hint" | t }}</p>
        </aside>
      </div>

      <div class="cropper-actions-inline">
        <ion-button fill="outline" (click)="close()">{{ "profile.crop_cancel" | t }}</ion-button>
        <ion-button [disabled]="!imageLoaded" (click)="apply()">{{ "profile.crop_save" | t }}</ion-button>
      </div>
    </ion-content>
  </ng-template>
</ion-modal>
