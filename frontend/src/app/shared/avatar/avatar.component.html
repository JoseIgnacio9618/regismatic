<div class="avatar-shell" [class.avatar-sm]="size === 'sm'" [class.avatar-lg]="size === 'lg'">
  <img *ngIf="resolvedPhotoUrl; else fallbackAvatar" [src]="resolvedPhotoUrl" [alt]="fullName" (error)="onImageError()" />

  <ng-template #fallbackAvatar>
    <div class="avatar-fallback" [attr.aria-label]="fullName">
      <span>{{ initials }}</span>
    </div>
  </ng-template>
</div>
